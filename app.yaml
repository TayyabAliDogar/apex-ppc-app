runtime: nodejs20

instance_class: F1

env_variables:
  NODE_ENV: "production"

handlers:
  # Serve static files from dist directory
  - url: /assets
    static_dir: dist/assets
    secure: always

  # Serve favicon and other root files
  - url: /(.*\.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot))
    static_files: dist/\1
    upload: dist/.*\.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)
    secure: always

  # API routes go to the Node.js server
  - url: /api/.*
    script: auto
    secure: always

  # All other routes serve index.html (SPA)
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 1000ms
  max_pending_latency: 5000ms
